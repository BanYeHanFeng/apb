[package]
name = "apb"
version = "0.2.0"
edition = "2021"
description = "Single-binary agent/controller relay for Termux, ephemeral CI runners and any minimal Linux node. No sshd; optional config file."
license = "MIT"

[lib]
name = "apb"
path = "src/lib.rs"

[[bin]]
name = "apb"
path = "src/main.rs"

[dependencies]
# 线协议固定为 Noise_NNpsk0_25519_ChaChaPoly_BLAKE2s，因此只启用用到的算法后端。
# 注意别打开 snow 的 `std` 特性：它会顺带启用并未使用的 ring 后端（需要 cc 交叉编译），
# 对静态 musl 产物没有收益。
snow = { version = "0.10", default-features = false, features = [
    "default-resolver",
    "use-chacha20poly1305",
    "use-curve25519",
    "use-blake2",
    "use-getrandom",
] }
sha2 = "0.11"
getrandom = "0.4"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
