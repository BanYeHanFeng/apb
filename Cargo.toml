[package]
name = "apb"
version = "0.1.0"
edition = "2021"
description = "Single-binary agent/controller relay for Termux, ephemeral CI runners and any minimal Linux node. No sshd, no config files."
license = "MIT"

[lib]
name = "apb"
path = "src/lib.rs"

[[bin]]
name = "apb"
path = "src/main.rs"

[dependencies]
snow = "0.9"
sha2 = "0.10"
getrandom = "0.2"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
